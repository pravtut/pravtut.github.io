<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Home · STORE</title><link rel=stylesheet href=style.css><script src=common.js></script></head><body><header><div class="nav"><a class="logo sn" href="index.html">Store</a><nav><a href="index.html#shop">Shop</a><a href="about.html">About</a><a href="shipping.html">Shipping</a><a href="returns.html">Returns</a><a href="contact.html">Contact</a></nav><a class="cartbtn" href="checkout.html">🛒 Cart (<span class="cc">0</span>)</a></div></header>
<section class="hero"><h1>2026's Most-Wanted Gadgets & Essentials</h1><p>100 trending best-sellers — hand-picked from this year's top-selling products. Free shipping on orders over $49.</p><a href="#shop">Shop the Top 100</a></section>
<main id="shop"><div class="tools"><input id="q" placeholder="Search 100 products…"><select id="sort"><option value="rank">Sort: Best-selling</option><option value="lo">Price: Low → High</option><option value="hi">Price: High → Low</option></select></div><div class="chips" id="chips"></div><p id="cnt" style="color:#64748b"></p><div class="grid" id="grid"></div></main>
<div class="modal" id="modal"><div class="mbox"><div class="ph" id="mph"></div><div class="b"><div><button class="x" onclick="closeM()">×</button><div class="cat" id="mcat"></div></div><h2 id="mname" style="margin:0"></h2><div class="price" id="mprice"></div><p id="mdesc" style="color:#475569"></p><button class="add" id="madd">Add to cart</button></div></div></div>
<script src="products.js"></script><script>
const P=window.PRODUCTS;let cat="All";const cats=["All",...new Set(P.map(p=>p.category))];
const chips=document.getElementById("chips");cats.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c=="All"?" on":"");b.textContent=(ICON[c]||"⭐")+" "+c;b.onclick=()=>{cat=c;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()};chips.appendChild(b)});
function ph(p){return `background:hsl(${HUE(p.category)},60%,94%)`}
function render(){const q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("sort").value;let L=P.filter(p=>(cat=="All"||p.category==cat)&&(p.name+p.category).toLowerCase().includes(q));if(s=="lo")L.sort((a,b)=>a.retail_price-b.retail_price);if(s=="hi")L.sort((a,b)=>b.retail_price-a.retail_price);
document.getElementById("cnt").textContent=L.length+" products";document.getElementById("grid").innerHTML=L.map(p=>`<div class="card" onclick="openM(${p.rank})"><div class="ph" style="${ph(p)}">${ICON[p.category]||"⭐"}</div><div class="b">${p.rank<=10?'<span class="badge">🔥 Top 10</span>':''}<div class="cat">${p.category}</div><h3>${p.name}</h3><div class="price">${fmt(p.retail_price)}</div><button class="add" onclick="event.stopPropagation();cart.add(${p.rank});this.textContent='Added ✓'">Add to cart</button></div></div>`).join("")}
function openM(r){const p=P.find(x=>x.rank==r);mph.style.cssText=ph(p);mph.textContent=ICON[p.category]||"⭐";mcat.textContent=p.category+" · #"+p.rank+" best-seller";mname.textContent=p.name;mprice.textContent=fmt(p.retail_price);mdesc.textContent=`One of 2026's trending ${p.category.toLowerCase()} picks. Ships in 7–15 business days with tracking. 30-day returns.`;madd.onclick=()=>{cart.add(r);madd.textContent="Added ✓";setTimeout(()=>madd.textContent="Add to cart",1200)};modal.classList.add("on")}
function closeM(){modal.classList.remove("on")}modal.onclick=e=>{if(e.target==modal)closeM()};document.onkeydown=e=>{if(e.key=="Escape")closeM()};
q.oninput=render;sort.onchange=render;render();
</script>
<footer>© 2026 <span class="sn"></span> · Calgary, AB, Canada · Prices in USD<br><br><a href="about.html">About</a><a href="shipping.html">Shipping</a><a href="returns.html">Returns</a><a href="contact.html">Contact</a></footer></body></html>
